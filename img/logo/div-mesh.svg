<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350" width="550" height="350">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c8a"/>
      <stop offset=".5" stop-color="#c85cff"/>
      <stop offset="1" stop-color="#8f7bff"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3cf"/>
      <stop offset="1" stop-color="#d9c2ff"/>
    </linearGradient>

    <!-- Треугольная сетка с узлами для заливки букв -->
    <pattern id="mesh" width="24" height="41.57" patternUnits="userSpaceOnUse" patternTransform="rotate(9)">
      <g stroke="#e9b8ff" stroke-width="1.4" stroke-opacity=".75">
        <line x1="0" y1="0" x2="24" y2="0"/>
        <line x1="0" y1="20.78" x2="24" y2="20.78"/>
        <line x1="0" y1="0" x2="24" y2="41.57"/>
        <line x1="24" y1="0" x2="0" y2="41.57"/>
      </g>
      <g fill="#fff">
        <circle cx="0" cy="0" r="2.2"/><circle cx="24" cy="0" r="2.2"/>
        <circle cx="12" cy="20.78" r="2.2"/>
        <circle cx="0" cy="41.57" r="2.2"/><circle cx="24" cy="41.57" r="2.2"/>
      </g>
    </pattern>

    <!-- Контуры букв D, I, V -->
    <path id="letters" fill-rule="evenodd" d="
      M215 127 H300 L332 157 V193 L300 223 H215 Z
      M245 153 V197 H289 L302 185 V165 L289 153 Z
      M350 127 H382 V223 H350 Z
      M400 127 H434 L463 191 L492 127 H526 L478 223 H448 Z"/>
    <clipPath id="clip"><use href="#letters"/></clipPath>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Большое кольцо: центр (212, 175) у начала буквы D, лента от радиуса 136 до 172.
       Разрыв ±38°, сегменты внутри разрыва заканчивают кольцо над буквой I -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M347.5 69.1 A172 172 0 1 0 347.5 280.9" stroke="url(#g)" stroke-width="3"/>
    <path d="M342.8 72.8 A166 166 0 1 0 342.8 277.2" stroke="url(#g)" stroke-width="4" stroke-dasharray="0 8"/>
    <path d="M336.5 77.7 A158 158 0 1 0 336.5 272.3" stroke="url(#g)" stroke-width="4" stroke-dasharray="0 9" stroke-dashoffset="4"/>
    <path d="M330.2 82.6 A150 150 0 1 0 330.2 267.4" stroke="url(#g)" stroke-width="3.6" stroke-dasharray="0 10"/>
    <path d="M323.9 87.6 A142 142 0 1 0 323.9 262.4" stroke="url(#g)" stroke-width="3.2" stroke-dasharray="0 11" stroke-dashoffset="5" stroke-opacity=".8"/>
    <path d="M319.2 91.3 A136 136 0 1 0 319.2 258.7" stroke="url(#g)" stroke-width="2.4" stroke-opacity=".85"/>
    <!-- Внутренние дуги сверху и снизу -->
    <path d="M278.5 80 A116 116 0 0 0 123.1 100.4" stroke="url(#g)" stroke-width="3" stroke-dasharray="0 8" stroke-opacity=".75"/>
    <path d="M123.1 249.6 A116 116 0 0 0 278.5 270" stroke="url(#g)" stroke-width="3" stroke-dasharray="0 8" stroke-opacity=".75"/>
  </g>

  <!-- Сегменты: три слева снаружи и по два в разрыве — над и под буквой I -->
  <g fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
    <rect x="14" y="166" width="20" height="18" rx="3" transform="rotate(-11 212 175)"/>
    <rect x="14" y="166" width="20" height="18" rx="3"/>
    <rect x="14" y="166" width="20" height="18" rx="3" transform="rotate(11 212 175)"/>
    <rect x="42" y="169" width="28" height="12" rx="3" transform="rotate(149 212 175)"/>
    <rect x="42" y="169" width="28" height="12" rx="3" transform="rotate(155 212 175)"/>
    <rect x="42" y="169" width="28" height="12" rx="3" transform="rotate(-149 212 175)"/>
    <rect x="42" y="169" width="28" height="12" rx="3" transform="rotate(-155 212 175)"/>
  </g>

  <!-- Буквы: сетка внутри, светящийся контур снаружи -->
  <g filter="url(#glow)">
    <rect x="200" y="115" width="340" height="120" fill="url(#mesh)" clip-path="url(#clip)"/>
    <use href="#letters" fill="none" stroke="url(#gl)" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
