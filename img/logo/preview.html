<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Логотип DIV</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Manrope", sans-serif; background: #1c0812; color: #fdf0f5; padding: 48px 16px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 34px; letter-spacing: -.02em; }
  p.sub { color: #d0aabb; margin: 6px 0 36px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .box { border-radius: 24px; padding: 40px; display: grid; place-items: center; min-height: 260px; position: relative; }
  .box span { position: absolute; left: 20px; bottom: 14px; font-size: 13px; opacity: .6; }
  .dark { background: radial-gradient(ellipse at 20% 0%, rgba(224,51,95,.35), transparent 60%), radial-gradient(ellipse at 90% 100%, rgba(138,91,255,.4), transparent 60%), #24091a; border: 1px solid rgba(255,190,220,.14); }
  .light { background: #fbf3f6; color: #2a0b1c; }
  .wide { grid-column: span 2; }
  .box img { max-width: 100%; }
  .sizes { display: flex; align-items: end; gap: 28px; }
  .tg { display: flex; align-items: center; gap: 14px; background: #2a0b1c; padding: 14px 22px 14px 14px; border-radius: 18px; }
  .tg img { width: 56px; height: 56px; border-radius: 50%; }
  .tg b { display: block; }
  .tg small { color: #d0aabb; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Логотип DIV</h1>
  <p class="sub">«I» — курсор набора текста, скобки &lt; /&gt; — HTML-тег &lt;div&gt;. Знак говорит сам за себя: этот человек делает сайты.</p>
  <div class="grid">
    <div class="box dark wide"><img src="div-logo-dark.svg" width="520" alt="Логотип DIV на тёмном фоне"><span>Основной, для тёмного фона</span></div>
    <div class="box light"><img src="div-logo-light.svg" width="400" alt="Логотип DIV на светлом фоне"><span>Для светлого фона</span></div>
    <div class="box dark"><img src="div-icon.svg" width="200" alt="Значок DIV"><span>Значок (аватарка, иконка сайта)</span></div>
    <div class="box dark">
      <div class="sizes">
        <img src="div-icon.svg" width="96" alt=""><img src="div-icon.svg" width="56" alt=""><img src="div-icon.svg" width="32" alt=""><img src="div-icon.svg" width="16" alt="">
      </div>
      <span>Читается даже в маленьком размере</span>
    </div>
    <div class="box dark">
      <div class="tg"><img src="div-icon.svg" alt=""><div><b>DIV | Сайты и боты</b><small>в сети</small></div></div>
      <span>Так будет выглядеть в Telegram</span>
    </div>
  </div>
</div>
</body>
</html>
